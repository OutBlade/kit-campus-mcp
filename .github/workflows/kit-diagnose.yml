name: KIT read-only diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet -e .
      - run: python examples/diagnose_campus.py
        env:
          KIT_USERNAME: ${{ secrets.KIT_USERNAME }}
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
