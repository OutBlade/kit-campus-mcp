name: KIT Notenbenachrichtigung

# Checks the KIT portal on a schedule and sends a Telegram message when a
# result appears or an exam registration changes. Also answers any chat
# commands (/noten, /pruefungen, ...) that arrived since the previous run.
on:
  schedule:
    # Hourly. GitHub queues scheduled runs, so the actual time drifts by a few
    # minutes - that is fine for exam results, which are published in batches.
    - cron: "17 * * * *"
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab
    inputs:
      check_only:
        description: "Verify KIT reads without Telegram messages or snapshot changes"
        type: boolean
        default: false
      ping:
        description: "Also send the current standing to Telegram (health check)"
        type: boolean
        default: false

# Never let two runs touch the committed state at the same time.
concurrency:
  group: kit-notify
  cancel-in-progress: false

permissions:
  contents: write # to commit the updated state back to the repository

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet -e .

      - name: Check KIT and notify
        id: campus
        env:
          KIT_USERNAME: ${{ secrets.KIT_USERNAME }}
          KIT_PASSWORD: ${{ secrets.KIT_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # State lives in the repo so the schedule remembers what it reported.
          KIT_CAMPUS_STATE_DIR: ${{ github.workspace }}/state
          KIT_LANGUAGE: de
          CHECK_ONLY: ${{ inputs.check_only }}
          PING: ${{ inputs.ping }}
        run: |
          # Capture only the program's exit code; unexpected errors still fail.
          set +e
          if [ "$CHECK_ONLY" = "true" ]; then
            python examples/telegram_bot.py --check-only
          elif [ "$PING" = "true" ]; then
            python examples/telegram_bot.py --once --ping
          else
            python examples/telegram_bot.py --once
          fi
          status=$?
          set -e
          case "$status" in
            0)
              echo "status=checked" >> "$GITHUB_OUTPUT"
              echo "### KIT check completed" >> "$GITHUB_STEP_SUMMARY"
              ;;
            75)
              echo "status=deferred" >> "$GITHUB_OUTPUT"
              echo "::warning title=KIT temporarily unavailable::Poll deferred after bounded retries. Previous results remain unchanged; the next scheduled run will retry."
              {
                echo "### DEFERRED: KIT temporarily unavailable"
                echo "The portal did not provide results after retries. This is not a successful results check."
                echo "No result snapshot or Telegram offset will be committed. The next scheduled run retries automatically."
                echo "See the check step for the HTTP status or timeout. Authentication and parsing errors still fail the job."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *) exit "$status" ;;
          esac

      - name: Persist state
        if: ${{ !inputs.check_only && steps.campus.outputs.status == 'checked' }}
        run: |
          # cookies.lwp is gitignored - only the snapshot and the Telegram
          # offset are committed.
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "State: KIT check $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No state change."
          fi
