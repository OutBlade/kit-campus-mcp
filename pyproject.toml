[project]
name = "kit-campus-mcp"
version = "0.1.0"
description = "MCP server for the KIT Campus portal: exam results, exam registrations, study progress and the public module catalogue."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    # cryptography arrives transitively via mcp -> pyjwt[crypto]. 46.0.3 is the
    # last release with a win_arm64 wheel; anything newer is built from source
    # on ARM64 Windows and needs a Rust toolchain. Pin it on that platform only.
    "cryptography<=46.0.3; platform_system == 'Windows' and platform_machine == 'ARM64'",
]

[project.scripts]
kit-campus-mcp = "kit_campus_mcp.server:main"
kit-campus = "kit_campus_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kit_campus_mcp"]
